[project]
name = "platform-admin"
version = "0.1.0"
description = "Backend for Platform Admins to manage platform Users."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "openpyxl>=3.1.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "alembic>=1.19.1",
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
app = "app.main:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # autogenerated migration files are not linted/formatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # fake passwords/tokens in test fixtures are safe

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.api.deps.require_permission"]  # FastAPI reads these at import; safe as defaults

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]  # lets mypy accept SQLModel/Pydantic Field(...) assignments

[[tool.mypy.overrides]]
module = ["jose"]
ignore_missing_imports = true   # python-jose ships no type stubs

[[tool.mypy.overrides]]
module = [
    "opentelemetry.sdk.resources",
    "opentelemetry.sdk.trace",
    "opentelemetry.sdk.trace.export",
    "opentelemetry.sdk.trace.sampling",
    "opentelemetry.exporter.otlp.proto.http.trace_exporter",
    "opentelemetry.instrumentation.fastapi",
    "opentelemetry.instrumentation.sqlalchemy",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=app/services --cov=app/repositories --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
